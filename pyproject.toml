[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blossom"
version = "1.0.0"
description = "A framework for multimodal federated learning"
requires-python = ">=3.11"

dependencies = [
    # Framework dependencies
    "flwr[simulation]==1.17.0",
    "flwr-datasets==0.5.0",
    "numpy==2.2.4",
    "pandas==2.2.3",
    "torch==2.8.0",
    "datasets==3.1.0",
    "huggingface-hub==0.29.3",
    "matplotlib==3.10.1",
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",
    "rich==13.9.4",
    # Benchmark dependencies
    "pillow==11.1.0",
    "transformers==4.50.3",
    "torchvision==0.23.0",
    "torchaudio==2.8.0",
    "torchmultimodal-nightly==2024.4.1",
    "librosa==0.11.0",
    "soundfile==0.13.1"
]

[tool.setuptools]
packages = ["blossom"]